<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViralMate AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #F7F7FA;
      color: #171725;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      color: #6C4CE6;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      background: #6C4CE6;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    #result {
      margin-top: 15px;
      padding: 15px;
      background: #f0edff;
      border-radius: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ViralMate AI 🚀</h1>
  <p>Create. Post. Grow.</p>

  <div class="card">

    <h2>Create Content</h2>

    <textarea id="topic"
      placeholder="Enter your topic..."></textarea>

    <button onclick="caption()">
      ✍️ Create Caption
    </button>

    <button onclick="script()">
      🎬 Create Video Script
    </button>

    <button onclick="ideas()">
      💡 Get Content Ideas
    </button>

    <div id="result">
      Your result will appear here.
    </div>

  </div>

</div>

<script>

function getTopic() {
  return document.getElementById("topic").value.trim() || "social media";
}

function show(text) {
  document.getElementById("result").textContent = text;
}

function caption() {
  const topic = getTopic();

  show(
`🔥 ${topic} content that deserves attention!

Create something useful, share it consistently and keep improving.

#${topic.replace(/\s+/g, "")} #ContentCreator #ViralMateAI`
  );
}

function script() {
  const topic = getTopic();

  show(
`🎬 VIDEO SCRIPT — ${topic}

🪝 HOOK:
"Stop scrolling! You need to know these things about ${topic}."

🎥 SCENE 1 — INTRO:
"Today we're talking about ${topic}, and I'm going to show you something useful."

💡 SCENE 2 — FIRST POINT:
"First, here's something important about ${topic}..."
Explain the first useful point clearly.

💡 SCENE 3 — SECOND POINT:
"Here's another thing you should know..."
Give a practical example related to ${topic}.

🔥 SCENE 4 — QUICK TIP:
"Here's one quick tip you can start using today..."
Give one simple action viewers can take.

📢 CTA:
"If you found this useful, follow for more content and share this video with someone who needs it!"

📝 ON-SCREEN TEXT:
"${topic} — Things You Should Know"

🎵 VIDEO STYLE:
Short-form • Fast-paced • Easy to understand • Social-media friendly`
  );
}

function ideas() {
  const topic = getTopic();

  show(
`5 CONTENT IDEAS — ${topic}

1. Beginner tips
2. Common mistakes
3. Quick tutorial
4. Before-and-after idea
5. Ask your audience a question`
  );
}

</script>

</body>
  </html>
<section style="margin:30px 0;padding:24px;border-radius:18px;background:#ffffff;box-shadow:0 8px 25px rgba(0,0,0,.08)">
  <h2>🎬 Video Content Planner</h2>
  <p>Turn your topic into a simple short-video plan.</p>

  <textarea id="videoTopic" placeholder="Example: fashion tips for beginners"
    style="width:100%;min-height:90px;padding:12px;border-radius:10px;border:1px solid #ddd;"></textarea>

  <button onclick="makeVideoPlan()"
    style="margin-top:12px;padding:12px 18px;border:0;border-radius:10px;cursor:pointer;">
    🎬 Create Video Plan
  </button>

  <div id="videoResult" style="margin-top:18px;white-space:pre-wrap;"></div>
</section>

<script>
function makeVideoPlan() {
  const topic = document.getElementById("videoTopic").value.trim();
  const result = document.getElementById("videoResult");

  if (!topic) {
    result.textContent = "Please enter a topic first.";
    return;
  }

  result.textContent =
`🎬 VIDEO PLAN

Topic: ${topic}

🪝 HOOK:
“Want to know more about ${topic}? Watch this!”

📝 SHORT SCRIPT:
Start by introducing ${topic}.
Give 2–3 useful points about it.
Finish with a simple call to action.

🎥 SCENE IDEAS:
1. Show the topic.
2. Show the first tip.
3. Show the second tip.
4. End with a clear message.

📌 CAPTION:
“Here are some useful tips about ${topic}! Save this for later.”

#️⃣ HASHTAGS:
#${topic.replace(/\\s+/g, "")} #Tips #ViralMateAI #ContentCreator`;
}
</script>
<section style="margin:30px 0;padding:24px;background:#f5f5f5;border-radius:16px;">
  <h2>🖼️ AI Picture Generator</h2>

  <p>Describe the picture you want ViralMate AI to create.</p>

  <textarea
    id="imagePrompt"
    placeholder="Example: A beautiful fashion photoshoot in a modern studio"
    style="width:100%;min-height:100px;padding:12px;border-radius:10px;"
  ></textarea>

  <button
    onclick="generateImagePrompt()"
    style="margin-top:12px;padding:12px 18px;border:0;border-radius:10px;cursor:pointer;"
  >
    🖼️ Create Picture
  </button>

  <div
    id="imageResult"
    style="margin-top:18px;white-space:pre-wrap;"
  ></div>
</section>

<script>
function generateImagePrompt() {
  const prompt = document.getElementById("imagePrompt").value.trim();
  const result = document.getElementById("imageResult");

  if (!prompt) {
    result.textContent = "Please describe the picture you want first.";
    return;
  }

  result.textContent =
`🖼️ PICTURE REQUEST

Your idea:
${prompt}

🎨 STYLE:
High-quality • Detailed • Social-media friendly

✨ Picture generator interface is ready!`;
}
</script>
